apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: gotrue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotrue
  template:
    metadata:
      labels:
        app: gotrue
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: supabase/gotrue:v2.192.0
          command: ["gotrue", "migrate"]
          envFrom:
            - configMapRef:
                name: gotrue-config
            - secretRef:
                name: gotrue-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gotrue
          image: supabase/gotrue:v2.192.0
          ports:
            - containerPort: 9999
          envFrom:
            - configMapRef:
                name: gotrue-config
            - secretRef:
                name: gotrue-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
