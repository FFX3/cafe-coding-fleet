apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest-webstudio
  namespace: platform-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest-webstudio
  template:
    metadata:
      labels:
        app: postgrest-webstudio
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.0
          ports:
            - containerPort: 3000
          env:
            # Database URL from generated secret (created by setup-databases.sh)
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: gen-postgrest-webstudio-credentials
                  key: DATABASE_URL
            - name: PGRST_DB_SCHEMAS
              value: "public"
            - name: PGRST_DB_ANON_ROLE
              value: "anon"
            # JWT verification using GoTrue's public key (RS256)
            - name: PGRST_JWT_SECRET
              value: '{"alg":"RS256","e":"AQAB","key_ops":["verify"],"kid":"auth-signing-key","kty":"RSA","n":"0bRBPr--McvssCV33_rAOZw1Fo7q_72h_kbB7NjKtP5k8xeDgvTVtRSx8_f8WDDNmWv3pZk3ncadAK8INcXHQQlruwtJZq_OEtazrnrmB-k24p2rIMj8n_VUc1vVrrYIOhZLslxLfTwuKOLZYzbDudETThu2htVI87VF1Eo9ZeHBdbME6B4YjUGnYgCDfn8pMCaQ8wtz9ZiwcOAN74yfJu2BfiMAnpwsHe6T5KNRugmGTZkPcJ-xFBKzmBaw9G0VM9hKh1JvUzCGoWhgzcX8XhD_YaqzebbAsxe_CYReRiT8q5IZNGVJ3Xl1CDZjVrhmEqcsW-WMhnWtA0V_1PxO-Q","use":"sig"}'
            - name: PGRST_JWT_AUD
              value: "authenticated"
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: "https://api.${DOMAIN}/webstudio"
            - name: PGRST_LOG_LEVEL
              value: "info"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
