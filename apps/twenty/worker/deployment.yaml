apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-worker
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-worker
  template:
    metadata:
      labels:
        app: twenty-worker
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: twenty-worker
          image: twentycrm/twenty:v2.39.0
          command: ["yarn", "worker:prod"]
          envFrom:
            - configMapRef:
                name: twenty-config
            - secretRef:
                name: twenty-credentials
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: DISABLE_DB_MIGRATIONS
              value: "true"
            - name: LOGIC_FUNCTION_TYPE
              value: "LOCAL"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: twenty-storage
              mountPath: /app/packages/twenty-server/.local-storage
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "300m"
      volumes:
        - name: twenty-storage
          persistentVolumeClaim:
            claimName: twenty-server-pvc
