apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  namespace: email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postfix
          image: boky/postfix:latest
          ports:
            - containerPort: 587
              name: smtp
          envFrom:
            - configMapRef:
                name: email-config
          env:
            - name: RELAYHOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-credentials
                  key: RESEND_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            tcpSocket:
              port: 587
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 587
            initialDelaySeconds: 5
            periodSeconds: 10
