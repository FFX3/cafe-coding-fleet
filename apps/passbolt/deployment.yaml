apiVersion: apps/v1
kind: Deployment
metadata:
  name: passbolt
  namespace: passbolt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passbolt
  template:
    metadata:
      labels:
        app: passbolt
    spec:
      securityContext:
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 33:33 /var/lib/passbolt"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: passbolt-data
              mountPath: /var/lib/passbolt
      containers:
        - name: passbolt
          image: passbolt/passbolt:5.15.0-1-ce
          ports:
            - containerPort: 443
              name: https
          envFrom:
            - configMapRef:
                name: passbolt-config
            - secretRef:
                name: passbolt-credentials
          volumeMounts:
            - name: passbolt-data
              mountPath: /var/lib/passbolt
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /healthcheck/status.json
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthcheck/status.json
              port: 443
              scheme: HTTPS
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthcheck/status.json
              port: 443
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        - name: passbolt-data
          persistentVolumeClaim:
            claimName: passbolt-pvc
