apiVersion: apps/v1
kind: Deployment
metadata:
  name: passbolt
  namespace: passbolt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passbolt
  template:
    metadata:
      labels:
        app: passbolt
    spec:
      securityContext:
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 33:33 /var/lib/passbolt"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: passbolt-data
              mountPath: /var/lib/passbolt
      containers:
        - name: passbolt
          image: passbolt/passbolt:latest-ce
          ports:
            - containerPort: 443
              name: https
          envFrom:
            - secretRef:
                name: passbolt-credentials
          env:
            - name: APP_FULL_BASE_URL
              value: "https://passbolt.justinmcintyre.com"
            - name: DATASOURCES_DEFAULT_DRIVER
              value: "Cake\\Database\\Driver\\Postgres"
            - name: DATASOURCES_DEFAULT_ENCODING
              value: "utf8"
            - name: PASSBOLT_SSL_FORCE
              value: "true"
            - name: PASSBOLT_REGISTRATION_PUBLIC
              value: "false"
            - name: PASSBOLT_PLUGINS_JWT_AUTHENTICATION_ENABLED
              value: "true"
            - name: EMAIL_TRANSPORT_DEFAULT_HOST
              value: "smtp.email.svc.cluster.local"
            - name: EMAIL_TRANSPORT_DEFAULT_PORT
              value: "587"
            - name: EMAIL_TRANSPORT_DEFAULT_TLS
              value: "false"
            - name: EMAIL_DEFAULT_FROM
              value: "passbolt@justinmcintyre.com"
            - name: EMAIL_DEFAULT_FROM_NAME
              value: "Passbolt"
          volumeMounts:
            - name: passbolt-data
              mountPath: /var/lib/passbolt
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /healthcheck/status.json
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthcheck/status.json
              port: 443
              scheme: HTTPS
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthcheck/status.json
              port: 443
              scheme: HTTPS
            periodSeconds: 10
      volumes:
        - name: passbolt-data
          persistentVolumeClaim:
            claimName: passbolt-pvc
