apiVersion: apps/v1
kind: Deployment
metadata:
  name: webstudio-publisher
  namespace: webstudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webstudio-publisher
  template:
    metadata:
      labels:
        app: webstudio-publisher
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: ghcr.io/webstudio-community/webstudio-publisher:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: webstudio-config
            - secretRef:
                name: webstudio-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
