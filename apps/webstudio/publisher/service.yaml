apiVersion: v1
kind: Service
metadata:
  name: webstudio-publisher
  namespace: webstudio
  # Publisher generates static HTML for deployment to Cloudflare/static hosting
  # Only needs internal access from the builder
spec:
  type: ClusterIP
  selector:
    app: webstudio-publisher
  ports:
    - port: 4000
      targetPort: 4000
