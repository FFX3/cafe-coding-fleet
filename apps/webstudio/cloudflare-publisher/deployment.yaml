apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-publisher
  namespace: webstudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-publisher
  template:
    metadata:
      labels:
        app: cloudflare-publisher
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: cloudflare-publisher:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: CONFIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: webstudio-credentials
                  key: CONFIG_DATABASE_URL
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webstudio-credentials
                  key: CLOUDFLARE_API_TOKEN
            - name: WEBSTUDIO_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webstudio-credentials
                  key: TRPC_SERVER_API_TOKEN
            - name: TRPC_SERVER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: webstudio-credentials
                  key: TRPC_SERVER_API_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
