apiVersion: apps/v1
kind: Deployment
metadata:
  name: webstudio-builder
  namespace: webstudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webstudio-builder
  template:
    metadata:
      labels:
        app: webstudio-builder
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Run Prisma migrations before starting the app
        - name: migrate
          image: ghcr.io/webstudio-community/builder:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: webstudio-config
            - secretRef:
                name: webstudio-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: builder
          image: ghcr.io/webstudio-community/builder:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: webstudio-config
            - secretRef:
                name: webstudio-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
