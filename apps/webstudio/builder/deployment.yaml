apiVersion: apps/v1
kind: Deployment
metadata:
  name: webstudio-builder
  namespace: webstudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webstudio-builder
  template:
    metadata:
      labels:
        app: webstudio-builder
    spec:
      imagePullSecrets:
        - name: gcr-credentials
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: builder
          image: webstudio-builder:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DIRECT_URL
              value: $(DATABASE_URL)
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: webstudio-credentials
                  key: WEBSTUDIO_OIDC_CLIENT_ID
          envFrom:
            - configMapRef:
                name: webstudio-config
            - secretRef:
                name: webstudio-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
