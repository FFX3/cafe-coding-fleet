apiVersion: v1
kind: ConfigMap
metadata:
  name: webstudio-config
  namespace: webstudio
data:
  # URLs
  DEPLOYMENT_URL: https://webstudio.${DOMAIN}
  DEPLOYMENT_ENVIRONMENT: production
  APP_FQDN: webstudio.${DOMAIN}

  # TRPC deployment service (publisher)
  TRPC_SERVER_URL: http://webstudio-publisher.webstudio.svc.cluster.local:4000/trpc

  # PostgREST API (external URL with TLS)
  POSTGREST_URL: https://api.justinmcintyre.com/webstudio

  # S3/MinIO storage (internal)
  S3_ENDPOINT: http://minio.webstudio.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_BUCKET: webstudio-assets

  # Features
  FEATURES: "*"
  USER_PLAN: Pro
  MAX_ASSETS_PER_PROJECT: "50"

  # Plan definitions - Pro plan unlocks all features for self-hosted
  PLANS: |
    [
      {
        "name": "Pro",
        "features": {
          "canDownloadAssets": true,
          "canRestoreBackups": true,
          "allowAdditionalPermissions": true,
          "allowDynamicData": true,
          "allowAuth": true,
          "allowContentMode": true,
          "allowStagingPublish": true,
          "maxContactEmailsPerProject": 100,
          "maxDomainsAllowedPerUser": 100,
          "maxDailyPublishesPerUser": 1000,
          "maxWorkspaces": 100,
          "maxProjectsAllowedPerUser": 1000,
          "maxAssetsPerProject": 1000,
          "seatsIncluded": 100,
          "maxSeatsPerWorkspace": 100
        }
      }
    ]

  # Auth - OIDC via GoTrue
  OIDC_ISSUER_URL: https://auth.${DOMAIN}
  OIDC_PROVIDER_NAME: Studio
