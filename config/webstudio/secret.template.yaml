# Template for webstudio secrets
# To use:
#   1. Copy this file to secret.yaml
#   2. Generate secrets: openssl rand -hex 32
#   3. Fill in values below
#   4. Encrypt: sops --encrypt secret.yaml > secret.enc.yaml
#   5. Delete the unencrypted secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: webstudio-credentials
  namespace: webstudio
type: Opaque
stringData:
  # Database URL (used by setup-databases.sh to create PostgREST secret)
  DATABASE_URL: "postgres://webstudio:CHANGE_ME@postgres.postgres.svc.cluster.local:5432/webstudio"

  # Session/auth secret (openssl rand -hex 32)
  AUTH_SECRET: "CHANGE_ME"

  # Builder <-> Publisher authentication (openssl rand -hex 32)
  TRPC_SERVER_API_TOKEN: "CHANGE_ME"

  # MinIO credentials (openssl rand -hex 16)
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"  # Same as MINIO_ROOT_PASSWORD
